<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders | SHOPORA</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        /* =========================
           ORDERS PAGE
        ========================= */

        body {
            background: #fff9fb;
        }

        .orders-page {
            position: relative;
            overflow: hidden;
            padding: 55px 20px 80px;
            min-height: 85vh;
        }

        /* Background decoration */

        .orders-page::before {
            content: "";
            position: absolute;
            width: 420px;
            height: 420px;
            background: #fff0f4;
            border-radius: 50%;
            top: -180px;
            right: -150px;
            z-index: 0;
        }

        .orders-page::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: #f8e7ed;
            border-radius: 50%;
            bottom: -150px;
            left: -120px;
            z-index: 0;
        }

        .orders-wrapper {
            max-width: 1180px;
            margin: auto;
            position: relative;
            z-index: 1;
        }


        /* =========================
           PAGE HEADER
        ========================= */

        .orders-header {
            background: linear-gradient(
                135deg,
                #fff0f4,
                #ffffff
            );

            border: 1px solid #f0dce3;
            border-radius: 24px;
            padding: 35px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            box-shadow: 0 15px 40px rgba(185, 86, 120, 0.08);
        }

        .header-text span {
            color: #d97898;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header-text h1 {
            margin: 8px 0 6px;
            font-size: 36px;
            color: #29232b;
        }

        .header-text p {
            margin: 0;
            color: #756d73;
            font-size: 14px;
        }

        .orders-icon {
            width: 80px;
            height: 80px;
            border-radius: 22px;
            background: #d97898;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            box-shadow: 0 12px 25px rgba(185, 86, 120, 0.22);
        }


        /* =========================
           STATISTICS
        ========================= */

        .order-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: white;
            border: 1px solid #f0dce3;
            border-radius: 18px;
            padding: 22px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(185, 86, 120, 0.06);
            transition: 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(185, 86, 120, 0.12);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: #fff0f4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .stat-info span {
            display: block;
            color: #756d73;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .stat-info strong {
            color: #29232b;
            font-size: 21px;
        }


        /* =========================
           SECTION TITLE
        ========================= */

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .section-heading h2 {
            margin: 0;
            color: #29232b;
            font-size: 24px;
        }

        .section-heading span {
            color: #756d73;
            font-size: 13px;
        }


        /* =========================
           ORDER CARD
        ========================= */

        .order-card {
            background: white;
            border: 1px solid #f0dce3;
            border-radius: 22px;
            margin-bottom: 22px;
            padding: 25px;
            box-shadow: 0 12px 35px rgba(185, 86, 120, 0.07);
            transition: 0.3s ease;
        }

        .order-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 40px rgba(185, 86, 120, 0.12);
        }


        /* Order top */

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 18px;
            border-bottom: 1px solid #f3e4e9;
        }

        .order-id small {
            display: block;
            color: #756d73;
            font-size: 11px;
            margin-bottom: 5px;
        }

        .order-id strong {
            font-size: 17px;
            color: #29232b;
        }

        .order-date {
            color: #756d73;
            font-size: 12px;
            margin-top: 5px;
        }

        .order-status {
            padding: 8px 16px;
            border-radius: 30px;
            background: #fff0f4;
            color: #b95678;
            font-size: 12px;
            font-weight: 700;
        }


        /* =========================
           PRODUCT ROW
        ========================= */

        .order-product {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 22px 0;
        }

        .product-image {
            width: 85px;
            height: 85px;
            border-radius: 16px;
            background: linear-gradient(
                135deg,
                #f5dce5,
                #fff0f4
            );

            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 34px;
            flex-shrink: 0;
        }

        .product-details {
            flex: 1;
        }

        .product-details h3 {
            margin: 0 0 7px;
            color: #29232b;
            font-size: 16px;
        }

        .product-details p {
            margin: 3px 0;
            color: #756d73;
            font-size: 13px;
        }

        .product-price {
            text-align: right;
        }

        .product-price span {
            display: block;
            color: #756d73;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .product-price strong {
            color: #b95678;
            font-size: 19px;
        }


        /* =========================
           PROGRESS
        ========================= */

        .order-progress {
            background: #fff9fb;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 22px;
        }

        .progress-title {
            font-size: 12px;
            color: #756d73;
            margin-bottom: 15px;
        }

        .progress-line {
            display: flex;
            align-items: center;
        }

        .progress-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            flex: 1;
        }

        .progress-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #f0dce3;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            z-index: 2;
        }

        .progress-step.active .progress-circle {
            background: #d97898;
        }

        .progress-step span {
            margin-top: 8px;
            font-size: 10px;
            color: #756d73;
            text-align: center;
        }

        .progress-step.active span {
            color: #b95678;
            font-weight: 700;
        }

        .progress-bar {
            height: 3px;
            background: #f0dce3;
            flex: 1;
            margin: 0 -2px;
            margin-top: -18px;
        }

        .progress-bar.active {
            background: #d97898;
        }


        /* =========================
           ORDER FOOTER
        ========================= */

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f3e4e9;
            padding-top: 20px;
        }

        .total-box span {
            color: #756d73;
            font-size: 12px;
        }

        .total-box strong {
            display: block;
            color: #29232b;
            font-size: 22px;
            margin-top: 3px;
        }

        .order-buttons {
            display: flex;
            gap: 10px;
        }

        .order-btn {
            text-decoration: none;
            padding: 11px 19px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            transition: 0.3s ease;
        }

        .track-btn {
            background: #d97898;
            color: white;
        }

        .track-btn:hover {
            background: #b95678;
        }

        .details-btn {
            background: #fff0f4;
            color: #b95678;
        }

        .details-btn:hover {
            background: #f5dce5;
        }


        /* =========================
           EMPTY STATE
        ========================= */

        .empty-orders {
            background: white;
            border: 1px solid #f0dce3;
            border-radius: 24px;
            padding: 70px 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(185, 86, 120, 0.07);
        }

        .empty-icon {
            width: 90px;
            height: 90px;
            margin: auto;
            border-radius: 25px;
            background: #fff0f4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        .empty-orders h2 {
            color: #29232b;
            margin: 20px 0 8px;
        }

        .empty-orders p {
            color: #756d73;
            font-size: 14px;
        }

        .shop-now {
            display: inline-block;
            margin-top: 22px;
            padding: 13px 25px;
            border-radius: 10px;
            background: #d97898;
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
        }

        .shop-now:hover {
            background: #b95678;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 850px) {

            .order-stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .orders-header {
                padding: 28px;
            }

        }

        @media (max-width: 600px) {

            .orders-page {
                padding: 35px 15px 60px;
            }

            .orders-header {
                padding: 25px;
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }

            .header-text h1 {
                font-size: 29px;
            }

            .orders-icon {
                width: 60px;
                height: 60px;
                font-size: 27px;
                border-radius: 17px;
            }

            .order-stats {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .stat-card {
                padding: 15px;
            }

            .stat-icon {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }

            .stat-info strong {
                font-size: 18px;
            }

            .order-card {
                padding: 18px;
            }

            .order-top {
                align-items: flex-start;
                gap: 12px;
                flex-direction: column;
            }

            .order-product {
                align-items: flex-start;
            }

            .product-image {
                width: 65px;
                height: 65px;
                font-size: 27px;
            }

            .product-price {
                display: none;
            }

            .progress-step span {
                font-size: 8px;
            }

            .order-footer {
                align-items: flex-start;
                gap: 18px;
                flex-direction: column;
            }

            .order-buttons {
                width: 100%;
            }

            .order-btn {
                flex: 1;
                text-align: center;
            }

        }

    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="nav-container">

            <a href="index.html" class="logo">
                SHOP<span>ORA</span>
            </a>

            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Shop</a>
                <a href="index.html#categories">Categories</a>
                <a href="index.html#about">About</a>
                <a href="index.html#contact">Contact</a>
            </nav>

            <div class="nav-actions">

                <a href="login.html" class="icon-btn">
                    👤
                </a>

                <a href="cart.html" class="cart-btn">
                    🛒
                    <span id="cart-count">0</span>
                </a>

            </div>

        </div>

    </header>


    <!-- ================= ORDERS PAGE ================= -->

    <main class="orders-page">

        <div class="orders-wrapper">

            <!-- Header -->

            <section class="orders-header">

                <div class="header-text">

                    <span>SHOPORA ACCOUNT</span>

                    <h1>My Orders</h1>

                    <p>
                        Keep track of your purchases and order updates.
                    </p>

                </div>

                <div class="orders-icon">
                    📦
                </div>

            </section>


            <!-- Statistics -->

            <section class="order-stats">

                <div class="stat-card">

                    <div class="stat-icon">
                        🛍️
                    </div>

                    <div class="stat-info">
                        <span>Total Orders</span>
                        <strong id="total-orders">0</strong>
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-icon">
                        🚚
                    </div>

                    <div class="stat-info">
                        <span>In Progress</span>
                        <strong id="active-orders">0</strong>
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-icon">
                        ✅
                    </div>

                    <div class="stat-info">
                        <span>Delivered</span>
                        <strong id="delivered-orders">0</strong>
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-icon">
                        💰
                    </div>

                    <div class="stat-info">
                        <span>Total Spent</span>
                        <strong id="total-spent">Rs 0</strong>
                    </div>

                </div>

            </section>


            <!-- Orders Heading -->

            <div class="section-heading">

                <h2>Recent Orders</h2>

                <span id="orders-count-text">
                    Your latest purchases
                </span>

            </div>


            <!-- JavaScript will insert orders here -->

            <div id="orders-container"></div>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>© 2026 HIRA SHOPORA. All Rights Reserved.</p>

    </footer>


    <script src="js/orders.js"></script>

</body>

</html>
