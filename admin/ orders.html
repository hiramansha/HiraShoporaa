<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopora Admin - Orders</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff8fb;
            color: #29232b;
        }

        /* ==============================
           SIDEBAR
        ============================== */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: #ffffff;
            border-right: 1px solid #f0dce3;
            padding: 30px 20px;
            z-index: 1000;
        }

        .logo {
            font-size: 30px;
            font-weight: 800;
            color: #29232b;
            margin-bottom: 45px;
            padding-left: 12px;
        }

        .logo span {
            color: #d97898;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: #756d73;
            padding: 14px 15px;
            margin-bottom: 8px;
            border-radius: 12px;
            font-size: 15px;
            transition: 0.3s;
        }

        .nav-link:hover,
        .nav-link.active {
            background: #fff0f4;
            color: #b95678;
        }

        .nav-icon {
            width: 24px;
            text-align: center;
            font-size: 18px;
        }

        .logout-btn {
            position: absolute;
            bottom: 30px;
            left: 20px;
            right: 20px;
            border: none;
            background: #fff0f4;
            color: #b95678;
            padding: 13px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }

        /* ==============================
           MAIN CONTENT
        ============================== */

        .main {
            margin-left: 250px;
            padding: 35px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .topbar h1 {
            font-size: 30px;
            margin-bottom: 6px;
        }

        .topbar p {
            color: #756d73;
            font-size: 14px;
        }

        .refresh-btn {
            border: none;
            background: #d97898;
            color: white;
            padding: 11px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .refresh-btn:hover {
            background: #b95678;
        }

        /* ==============================
           SUMMARY CARDS
        ============================== */

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: white;
            border: 1px solid #f0dce3;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 12px 35px rgba(185, 86, 120, 0.08);
        }

        .summary-icon {
            font-size: 25px;
            margin-bottom: 14px;
        }

        .summary-card h3 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .summary-card p {
            color: #756d73;
            font-size: 14px;
        }

        /* ==============================
           SEARCH / FILTER
        ============================== */

        .filters {
            background: white;
            border: 1px solid #f0dce3;
            border-radius: 18px;
            padding: 20px;
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .search-box {
            flex: 1;
        }

        .search-box input,
        .status-filter select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #f0dce3;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            background: #fffafb;
        }

        .search-box input:focus,
        .status-filter select:focus {
            border-color: #d97898;
        }

        .status-filter {
            width: 220px;
        }

        /* ==============================
           ORDERS
        ============================== */

        .orders-panel {
            background: white;
            border: 1px solid #f0dce3;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 12px 35px rgba(185, 86, 120, 0.06);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .panel-header h2 {
            font-size: 21px;
        }

        #order-count {
            color: #756d73;
            font-size: 14px;
        }

        .order-card {
            border: 1px solid #f0dce3;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 18px;
            background: #fffafb;
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 18px;
        }

        .order-number {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .order-date {
            color: #756d73;
            font-size: 13px;
        }

        /* ==============================
           STATUS
        ============================== */

        .status-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-select {
            border: 1px solid #f0dce3;
            background: white;
            color: #29232b;
            padding: 9px 12px;
            border-radius: 9px;
            outline: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .status-select:focus {
            border-color: #d97898;
        }

        .status-select:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ==============================
           CUSTOMER INFO
        ============================== */

        .customer-section {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 18px;
        }

        .info-box {
            background: white;
            border: 1px solid #f0dce3;
            border-radius: 12px;
            padding: 15px;
        }

        .info-label {
            font-size: 11px;
            color: #756d73;
            text-transform: uppercase;
            margin-bottom: 7px;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 14px;
            font-weight: 600;
            word-break: break-word;
        }

        /* ==============================
           PRODUCTS
        ============================== */

        .items-section {
            border-top: 1px solid #f0dce3;
            padding-top: 18px;
        }

        .items-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f6e8ed;
            gap: 15px;
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .item-image {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 9px;
            border: 1px solid #f0dce3;
            background: white;
            flex-shrink: 0;
        }

        .item-name {
            font-size: 14px;
            font-weight: 600;
        }

        .item-quantity {
            color: #756d73;
            font-size: 12px;
            margin-top: 4px;
        }

        .item-price {
            font-weight: 700;
            font-size: 14px;
            white-space: nowrap;
        }

        .order-bottom {
            display: flex;
            justify-content: flex-end;
            margin-top: 18px;
        }

        .order-total {
            font-size: 18px;
            font-weight: 800;
            color: #b95678;
        }

        /* ==============================
           EMPTY STATE
        ============================== */

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #756d73;
        }

        .empty-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .empty h3 {
            color: #29232b;
            margin-bottom: 8px;
        }

        /* ==============================
           RESPONSIVE
        ============================== */

        @media (max-width: 1100px) {

            .summary-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .customer-section {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 800px) {

            .sidebar {
                width: 210px;
            }

            .main {
                margin-left: 210px;
                padding: 25px;
            }

            .filters {
                flex-direction: column;
            }

            .status-filter {
                width: 100%;
            }
        }

        @media (max-width: 600px) {

            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid #f0dce3;
            }

            .logout-btn {
                position: static;
                width: 100%;
                margin-top: 15px;
            }

            .main {
                margin-left: 0;
                padding: 18px;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

            .order-top {
                flex-direction: column;
            }

            .status-area {
                width: 100%;
            }

            .status-select {
                width: 100%;
            }
        }

    </style>

</head>


<body>


    <!-- ==============================
         SIDEBAR
    ============================== -->

    <aside class="sidebar">

        <div class="logo">
            SHOPORA<span>.</span>
        </div>


        <a href="dashboard.html" class="nav-link">
            <span class="nav-icon">📊</span>
            Dashboard
        </a>


        <a href="products.html" class="nav-link">
            <span class="nav-icon">🛍️</span>
            Products
        </a>


        <a href="orders.html" class="nav-link active">
            <span class="nav-icon">📦</span>
            Orders
        </a>


        <a href="users.html" class="nav-link">
            <span class="nav-icon">👥</span>
            Users
        </a>


        <a
            href="../index.html"
            class="nav-link"
            target="_blank"
        >
            <span class="nav-icon">🌐</span>
            Visit Store
        </a>


        <button
            class="logout-btn"
            onclick="adminLogout()"
        >
            🚪 Logout
        </button>

    </aside>



    <!-- ==============================
         MAIN
    ============================== -->

    <main class="main">


        <!-- TOPBAR -->

        <div class="topbar">

            <div>

                <h1>Orders</h1>

                <p>
                    Manage and update customer orders
                </p>

            </div>


            <button
                class="refresh-btn"
                onclick="loadOrders()"
            >
                🔄 Refresh
            </button>

        </div>



        <!-- ==============================
             SUMMARY
        ============================== -->

        <div class="summary-grid">


            <div class="summary-card">

                <div class="summary-icon">
                    📦
                </div>

                <h3 id="total-orders">
                    0
                </h3>

                <p>
                    Total Orders
                </p>

            </div>


            <div class="summary-card">

                <div class="summary-icon">
                    ⏳
                </div>

                <h3 id="pending-orders">
                    0
                </h3>

                <p>
                    Pending Orders
                </p>

            </div>


            <div class="summary-card">

                <div class="summary-icon">
                    🚚
                </div>

                <h3 id="shipped-orders">
                    0
                </h3>

                <p>
                    Shipped Orders
                </p>

            </div>


            <div class="summary-card">

                <div class="summary-icon">
                    ✅
                </div>

                <h3 id="delivered-orders">
                    0
                </h3>

                <p>
                    Delivered Orders
                </p>

            </div>

        </div>



        <!-- ==============================
             FILTERS
        ============================== -->

        <div class="filters">

            <div class="search-box">

                <input
                    type="text"
                    id="search-orders"
                    placeholder="Search by order ID or customer name..."
                    oninput="displayOrders()"
                >

            </div>


            <div class="status-filter">

                <select
                    id="status-filter"
                    onchange="displayOrders()"
                >

                    <option value="all">
                        All Status
                    </option>

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="Processing">
                        Processing
                    </option>

                    <option value="Shipped">
                        Shipped
                    </option>

                    <option value="Delivered">
                        Delivered
                    </option>

                    <option value="Cancelled">
                        Cancelled
                    </option>

                </select>

            </div>

        </div>



        <!-- ==============================
             ORDERS PANEL
        ============================== -->

        <section class="orders-panel">


            <div class="panel-header">

                <h2>
                    Customer Orders
                </h2>

                <span id="order-count">
                    0 orders
                </span>

            </div>


            <div id="orders-container">

                <div class="empty">

                    <div class="empty-icon">
                        ⏳
                    </div>

                    <h3>
                        Loading Orders...
                    </h3>

                    <p>
                        Please wait.
                    </p>

                </div>

            </div>


        </section>


    </main>



    <script>

        // ==========================================
        // API URL
        // ==========================================

        const ORDER_API_URL =
            "https://supreme-goggles-r474rw7j7vx7cxrrg-3000.app.github.dev/api/orders";


        // ==========================================
        // ORDERS ARRAY
        // ==========================================

        let orders = [];



        // ==========================================
        // LOAD ORDERS FROM MONGODB
        // ==========================================

        async function loadOrders() {

            const container =
                document.getElementById(
                    "orders-container"
                );


            container.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">⏳</div>
                    <h3>Loading Orders...</h3>
                    <p>Please wait.</p>
                </div>
            `;


            try {

                const response =
                    await fetch(
                        ORDER_API_URL
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Failed to load orders."
                    );

                }


                orders =
                    data.orders || [];


                updateSummary();

                displayOrders();


            } catch (error) {

                console.error(
                    "Orders API Error:",
                    error
                );


                container.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">⚠️</div>
                        <h3>Unable to Load Orders</h3>
                        <p>
                            Please make sure the Shopora backend is running.
                        </p>
                    </div>
                `;


                document.getElementById(
                    "order-count"
                ).textContent =
                    "0 orders";

            }

        }



        // ==========================================
        // DISPLAY ORDERS
        // ==========================================

        function displayOrders() {

            const container =
                document.getElementById(
                    "orders-container"
                );


            const searchValue =
                document
                    .getElementById(
                        "search-orders"
                    )
                    .value
                    .toLowerCase()
                    .trim();


            const statusValue =
                document
                    .getElementById(
                        "status-filter"
                    )
                    .value;


            const filteredOrders =
                orders.filter(function (order) {

                    const orderId =
                        String(
                            order._id || ""
                        ).toLowerCase();


                    const customerName =
                        String(
                            order.customerName || ""
                        ).toLowerCase();


                    const matchesSearch =
                        !searchValue ||
                        orderId.includes(
                            searchValue
                        ) ||
                        customerName.includes(
                            searchValue
                        );


                    const matchesStatus =
                        statusValue === "all" ||
                        order.status ===
                            statusValue;


                    return (
                        matchesSearch &&
                        matchesStatus
                    );

                });


            document.getElementById(
                "order-count"
            ).textContent =
                `${filteredOrders.length} orders`;


            if (
                filteredOrders.length === 0
            ) {

                container.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">📭</div>
                        <h3>No Orders Found</h3>
                        <p>
                            No orders match your search or filter.
                        </p>
                    </div>
                `;

                return;

            }


            container.innerHTML =
                filteredOrders
                    .map(function (order) {

                        return createOrderCard(
                            order
                        );

                    })
                    .join("");

        }



        // ==========================================
        // CREATE ORDER CARD
        // ==========================================

        function createOrderCard(order) {

            const customerName =
                escapeHtml(
                    order.customerName ||
                    "Customer"
                );


            const customerEmail =
                escapeHtml(
                    order.customerEmail ||
                    "No email"
                );


            const shippingAddress =
                escapeHtml(
                    order.shippingAddress ||
                    "No address"
                );


            const status =
                order.status ||
                "Pending";


            const products =
                order.products || [];


            const total =
                Number(
                    order.totalAmount
                ) || 0;


            const orderId =
                String(
                    order._id || ""
                );


            const shortOrderId =
                orderId
                    ? orderId.slice(-8)
                    : "N/A";


            let orderDate =
                "Date unavailable";


            if (order.createdAt) {

                const date =
                    new Date(
                        order.createdAt
                    );


                if (
                    !isNaN(
                        date.getTime()
                    )
                ) {

                    orderDate =
                        date.toLocaleString();

                }

            }



            const productHtml =
                products
                    .map(function (item) {

                        const itemName =
                            escapeHtml(
                                item.name ||
                                "Product"
                            );


                        const quantity =
                            Number(
                                item.quantity
                            ) || 1;


                        const price =
                            Number(
                                item.price
                            ) || 0;


                        const itemImage =
                            escapeHtml(
                                item.image ||
                                ""
                            );


                        return `
                            <div class="item-row">

                                <div class="item-left">

                                    ${
                                        itemImage
                                            ? `
                                                <img
                                                    src="${itemImage}"
                                                    class="item-image"
                                                    alt="${itemName}"
                                                >
                                              `
                                            : `
                                                <div class="item-image"></div>
                                              `
                                    }

                                    <div>

                                        <div class="item-name">
                                            ${itemName}
                                        </div>

                                        <div class="item-quantity">
                                            Quantity: ${quantity}
                                        </div>

                                    </div>

                                </div>


                                <div class="item-price">
                                    Rs. ${(price * quantity).toLocaleString()}
                                </div>

                            </div>
                        `;

                    })
                    .join("");



            return `
                <div class="order-card">

                    <div class="order-top">

                        <div>

                            <div class="order-number">
                                Order #${escapeHtml(shortOrderId)}
                            </div>

                            <div class="order-date">
                                ${escapeHtml(orderDate)}
                            </div>

                        </div>


                        <div class="status-area">

                            <select
                                class="status-select"
                                onchange="updateOrderStatus('${orderId}', this)"
                            >

                                <option
                                    value="Pending"
                                    ${status === "Pending" ? "selected" : ""}
                                >
                                    Pending
                                </option>

                                <option
                                    value="Processing"
                                    ${status === "Processing" ? "selected" : ""}
                                >
                                    Processing
                                </option>

                                <option
                                    value="Shipped"
                                    ${status === "Shipped" ? "selected" : ""}
                                >
                                    Shipped
                                </option>

                                <option
                                    value="Delivered"
                                    ${status === "Delivered" ? "selected" : ""}
                                >
                                    Delivered
                                </option>

                                <option
                                    value="Cancelled"
                                    ${status === "Cancelled" ? "selected" : ""}
                                >
                                    Cancelled
                                </option>

                            </select>

                        </div>

                    </div>



                    <div class="customer-section">


                        <div class="info-box">

                            <div class="info-label">
                                Customer
                            </div>

                            <div class="info-value">
                                ${customerName}
                            </div>

                        </div>


                        <div class="info-box">

                            <div class="info-label">
                                Email
                            </div>

                            <div class="info-value">
                                ${customerEmail}
                            </div>

                        </div>


                        <div class="info-box">

                            <div class="info-label">
                                Shipping Address
                            </div>

                            <div class="info-value">
                                ${shippingAddress}
                            </div>

                        </div>


                    </div>



                    <div class="items-section">

                        <div class="items-title">
                            Ordered Products
                        </div>

                        ${productHtml}

                    </div>



                    <div class="order-bottom">

                        <div class="order-total">
                            Total: Rs. ${total.toLocaleString()}
                        </div>

                    </div>

                </div>
            `;

        }



        // ==========================================
        // UPDATE ORDER STATUS
        // ==========================================

        async function updateOrderStatus(
            orderId,
            selectElement
        ) {

            const newStatus =
                selectElement.value;


            if (!orderId) {

                alert(
                    "Order ID is missing."
                );

                return;

            }


            selectElement.disabled = true;


            try {

                const response =
                    await fetch(
                        `${ORDER_API_URL}/${orderId}/status`,
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                status: newStatus
                            })
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Failed to update order status."
                    );

                }


                // Update local array

                const orderIndex =
                    orders.findIndex(
                        function (order) {

                            return (
                                order._id ===
                                orderId
                            );

                        }
                    );


                if (orderIndex !== -1) {

                    orders[orderIndex].status =
                        newStatus;

                }


                updateSummary();


                alert(
                    "Order status updated successfully! ✅"
                );


            } catch (error) {

                console.error(
                    "Status Update Error:",
                    error
                );


                alert(
                    "Unable to update order status. Please try again."
                );


                // Reload original status

                await loadOrders();


            } finally {

                selectElement.disabled =
                    false;

            }

        }



        // ==========================================
        // UPDATE SUMMARY
        // ==========================================

        function updateSummary() {

            const total =
                orders.length;


            const pending =
                orders.filter(
                    function (order) {

                        return (
                            order.status ===
                            "Pending"
                        );

                    }
                ).length;


            const shipped =
                orders.filter(
                    function (order) {

                        return (
                            order.status ===
                            "Shipped"
                        );

                    }
                ).length;


            const delivered =
                orders.filter(
                    function (order) {

                        return (
                            order.status ===
                            "Delivered"
                        );

                    }
                ).length;


            document.getElementById(
                "total-orders"
            ).textContent =
                total;


            document.getElementById(
                "pending-orders"
            ).textContent =
                pending;


            document.getElementById(
                "shipped-orders"
            ).textContent =
                shipped;


            document.getElementById(
                "delivered-orders"
            ).textContent =
                delivered;

        }



        // ==========================================
        // HTML ESCAPE
        // ==========================================

        function escapeHtml(value) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }



        // ==========================================
        // ADMIN LOGOUT
        // ==========================================

        function adminLogout() {

            localStorage.removeItem(
                "adminLoggedIn"
            );

            window.location.href =
                "admin-login.html";

        }



        // ==========================================
        // LOAD ORDERS ON PAGE LOAD
        // ==========================================

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                loadOrders();

            }
        );

    </script>


</body>

</html>
