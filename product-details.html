<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details | SHOPORA</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f7fc;
            color: #333;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.06);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: #7c3aed;
        }

        .logo span {
            color: #ec4899;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #444;
            font-weight: 600;
            transition: 0.3s;
        }

        nav a:hover {
            color: #7c3aed;
        }

        .cart-link {
            background: #7c3aed;
            color: white !important;
            padding: 10px 18px;
            border-radius: 25px;
        }

        .cart-link:hover {
            background: #6d28d9;
        }

        #cart-count {
            background: #ec4899;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 12px;
            margin-left: 4px;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 86%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .breadcrumb {
            margin-bottom: 30px;
            color: #777;
            font-size: 15px;
        }

        .breadcrumb a {
            color: #7c3aed;
            text-decoration: none;
        }

        /* =========================
           PRODUCT DETAILS
        ========================= */

        .product-details {
            background: white;
            border-radius: 25px;
            padding: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.07);
        }

        .product-image-box {
            background: #f8f7fc;
            border-radius: 22px;
            min-height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .product-image-box img {
            width: 100%;
            height: 500px;
            object-fit: contain;
            padding: 25px;
        }

        .product-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .category {
            display: inline-block;
            color: #ec4899;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .product-info h1 {
            font-size: 42px;
            line-height: 1.15;
            margin-bottom: 18px;
            color: #222;
        }

        .rating {
            color: #f59e0b;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .rating span {
            color: #777;
            font-size: 14px;
            margin-left: 8px;
        }

        .price {
            font-size: 38px;
            font-weight: bold;
            margin-bottom: 20px;

            background: linear-gradient(
                135deg,
                #7c3aed,
                #ec4899
            );

            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .old-price {
            color: #999;
            text-decoration: line-through;
            font-size: 18px;
            margin-left: 10px;
        }

        .description {
            color: #666;
            font-size: 17px;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .stock {
            display: inline-block;
            background: #ecfdf5;
            color: #059669;
            padding: 10px 15px;
            border-radius: 10px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .out-stock {
            background: #fef2f2;
            color: #dc2626;
        }

        /* =========================
           QUANTITY
        ========================= */

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .quantity-box label {
            font-weight: bold;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow: hidden;
        }

        .quantity-controls button {
            width: 42px;
            height: 42px;
            border: none;
            background: #f5f3ff;
            color: #7c3aed;
            font-size: 22px;
            cursor: pointer;
        }

        .quantity-controls button:hover {
            background: #ede9fe;
        }

        #quantity {
            width: 55px;
            height: 42px;
            border: none;
            text-align: center;
            font-size: 17px;
            font-weight: bold;
            outline: none;
        }

        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 15px 25px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .add-btn {
            background: #7c3aed;
            color: white;
        }

        .add-btn:hover {
            background: #6d28d9;
            transform: translateY(-2px);
        }

        .buy-btn {
            background: #ec4899;
            color: white;
        }

        .buy-btn:hover {
            background: #db2777;
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            background: white;
            padding: 70px;
            text-align: center;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.07);
        }

        .loading h2 {
            color: #7c3aed;
            margin-bottom: 10px;
        }

        .error-box {
            background: white;
            padding: 70px;
            text-align: center;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.07);
        }

        .error-box h2 {
            color: #dc2626;
            margin-bottom: 15px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            background: #7c3aed;
            color: white;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 10px;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 30px;
            margin-top: 60px;
        }

        footer span {
            color: #ec4899;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 850px) {

            header {
                padding: 18px 5%;
            }

            nav {
                gap: 12px;
            }

            nav a {
                font-size: 14px;
            }

            .product-details {
                grid-template-columns: 1fr;
                padding: 25px;
            }

            .product-info h1 {
                font-size: 32px;
            }

            .product-image-box {
                min-height: 350px;
            }

            .product-image-box img {
                height: 350px;
            }
        }

        @media (max-width: 550px) {

            .container {
                width: 92%;
            }

            header {
                flex-direction: column;
                gap: 15px;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .product-details {
                padding: 18px;
            }

            .product-info h1 {
                font-size: 28px;
            }

            .price {
                font-size: 30px;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <div class="logo">
            SHOP<span>ORA</span>
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="orders.html">Orders</a>

            <a href="cart.html" class="cart-link">
                🛒 Cart
                <span id="cart-count">0</span>
            </a>
        </nav>

    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="container">

        <div class="breadcrumb">
            <a href="index.html">Home</a>
            &nbsp; / &nbsp;
            <a href="products.html">Products</a>
            &nbsp; / &nbsp;
            Product Details
        </div>


        <div id="product-details">

            <div class="loading">
                <h2>Loading Product...</h2>
                <p>Please wait while we load the product.</p>
            </div>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer>
        <p>
            © 2026 SHOP<span>ORA</span>. All Rights Reserved.
        </p>
    </footer>


    <!-- =========================
         CART JS
    ========================= -->

    <script src="js/cart.js"></script>


    <!-- =========================
         PRODUCT DETAILS JS
    ========================= -->

    <script>

        /* =========================
           API URL
        ========================= */

        const API_URL =
            "https://organic-space-dollop-pj7jg97x7pj5h6x94-3000.app.github.dev/api/products";


        /* =========================
           GET PRODUCT ID
        ========================= */

        function getProductId() {

            const params = new URLSearchParams(
                window.location.search
            );

            return Number(params.get("id"));
        }


        /* =========================
           ESCAPE HTML
        ========================= */

        function escapeHtml(value) {

            if (value === null || value === undefined) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        /* =========================
           CREATE STARS
        ========================= */

        function createStars(rating) {

            const roundedRating = Math.round(
                Number(rating) || 0
            );

            let stars = "";

            for (let i = 1; i <= 5; i++) {

                if (i <= roundedRating) {
                    stars += "★";
                } else {
                    stars += "☆";
                }
            }

            return stars;
        }


        /* =========================
           LOAD PRODUCT
        ========================= */

        async function loadProduct() {

            const container =
                document.getElementById("product-details");

            const productId = getProductId();


            /* Check ID */

            if (!productId || productId < 1) {

                container.innerHTML = `
                    <div class="error-box">

                        <h2>Product Not Found</h2>

                        <p>
                            No valid product was selected.
                        </p>

                        <a
                            href="products.html"
                            class="back-btn"
                        >
                            Back to Products
                        </a>

                    </div>
                `;

                return;
            }


            try {

                /* =========================
                   FETCH FROM MONGODB API
                ========================= */

                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error(
                        "API request failed"
                    );
                }

                const data = await response.json();


                if (!data.success || !Array.isArray(data.products)) {

                    throw new Error(
                        "Invalid product data"
                    );
                }


                /* =========================
                   FIND PRODUCT
                   ========================= */

                const product =
                    data.products[productId - 1];


                if (!product) {

                    container.innerHTML = `
                        <div class="error-box">

                            <h2>Product Not Found</h2>

                            <p>
                                The requested product does not exist.
                            </p>

                            <a
                                href="products.html"
                                class="back-btn"
                            >
                                Back to Products
                            </a>

                        </div>
                    `;

                    return;
                }


                /* =========================
                   PRODUCT DATA
                ========================= */

                const name =
                    escapeHtml(product.name);

                const category =
                    escapeHtml(product.category);

                const description =
                    escapeHtml(
                        product.description ||
                        "No description available for this product."
                    );

                const image =
                    escapeHtml(product.image);

                const price =
                    Number(product.price || 0);

                const oldPrice =
                    Number(product.oldPrice || 0);

                const rating =
                    Number(product.rating || 0);

                const stock =
                    Number(product.stock || 0);


                /* =========================
                   STOCK STATUS
                ========================= */

                let stockHTML = "";

                if (stock > 0) {

                    stockHTML = `
                        <div class="stock">
                            ✓ In Stock · ${stock} available
                        </div>
                    `;

                } else {

                    stockHTML = `
                        <div class="stock out-stock">
                            ✕ Out of Stock
                        </div>
                    `;
                }


                /* =========================
                   OLD PRICE
                ========================= */

                let oldPriceHTML = "";

                if (oldPrice > price) {

                    oldPriceHTML = `
                        <span class="old-price">
                            $${oldPrice.toFixed(2)}
                        </span>
                    `;
                }


                /* =========================
                   RENDER PRODUCT
                ========================= */

                container.innerHTML = `

                    <div class="product-details">

                        <!-- PRODUCT IMAGE -->

                        <div class="product-image-box">

                            <img
                                src="${image}"
                                alt="${name}"
                                onerror="this.src='https://via.placeholder.com/500x500?text=SHOPORA+Product';"
                            >

                        </div>


                        <!-- PRODUCT INFORMATION -->

                        <div class="product-info">

                            <div class="category">
                                ${category}
                            </div>


                            <h1>
                                ${name}
                            </h1>


                            <div class="rating">

                                ${createStars(rating)}

                                <span>
                                    ${rating.toFixed(1)} Rating
                                </span>

                            </div>


                            <div class="price">

                                $${price.toFixed(2)}

                                ${oldPriceHTML}

                            </div>


                            <p class="description">
                                ${description}
                            </p>


                            ${stockHTML}


                            <!-- QUANTITY -->

                            <div class="quantity-box">

                                <label>
                                    Quantity:
                                </label>

                                <div class="quantity-controls">

                                    <button
                                        type="button"
                                        onclick="decreaseQuantity()"
                                    >
                                        −
                                    </button>

                                    <input
                                        type="number"
                                        id="quantity"
                                        value="1"
                                        min="1"
                                        max="${Math.max(stock, 1)}"
                                    >

                                    <button
                                        type="button"
                                        onclick="increaseQuantity()"
                                    >
                                        +
                                    </button>

                                </div>

                            </div>


                            <!-- BUTTONS -->

                            <div class="buttons">

                                <button
                                    class="btn add-btn"
                                    onclick="addProductToCart(${productId})"
                                    ${stock <= 0 ? "disabled" : ""}
                                >
                                    🛒 Add to Cart
                                </button>


                                <button
                                    class="btn buy-btn"
                                    onclick="buyNow(${productId})"
                                    ${stock <= 0 ? "disabled" : ""}
                                >
                                    ⚡ Buy Now
                                </button>

                            </div>

                        </div>

                    </div>

                `;

            } catch (error) {

                console.error(
                    "Product Details Error:",
                    error
                );

                container.innerHTML = `

                    <div class="error-box">

                        <h2>
                            Unable to Load Product
                        </h2>

                        <p>
                            Please make sure the Shopora backend is running.
                        </p>

                        <a
                            href="products.html"
                            class="back-btn"
                        >
                            Back to Products
                        </a>

                    </div>

                `;
            }
        }


        /* =========================
           INCREASE QUANTITY
        ========================= */

        function increaseQuantity() {

            const quantityInput =
                document.getElementById("quantity");

            if (!quantityInput) {
                return;
            }

            const current =
                Number(quantityInput.value) || 1;

            const max =
                Number(quantityInput.max) || 10;

            if (current < max) {
                quantityInput.value = current + 1;
            }
        }


        /* =========================
           DECREASE QUANTITY
        ========================= */

        function decreaseQuantity() {

            const quantityInput =
                document.getElementById("quantity");

            if (!quantityInput) {
                return;
            }

            const current =
                Number(quantityInput.value) || 1;

            if (current > 1) {
                quantityInput.value = current - 1;
            }
        }


        /* =========================
           ADD PRODUCT TO CART
        ========================= */

        async function addProductToCart(productId) {

            const quantityInput =
                document.getElementById("quantity");

            const quantity =
                Number(quantityInput?.value) || 1;


            try {

                const response =
                    await fetch(API_URL);

                const data =
                    await response.json();


                if (!data.success) {
                    alert("Unable to load product.");
                    return;
                }


                const product =
                    data.products[productId - 1];


                if (!product) {
                    alert("Product not found.");
                    return;
                }


                if (Number(product.stock) <= 0) {
                    alert("This product is out of stock.");
                    return;
                }


                /* =========================
                   GET EXISTING CART
                ========================= */

                let cart =
                    JSON.parse(
                        localStorage.getItem("cart")
                    ) || [];


                const existingProduct =
                    cart.find(
                        item => item.id === productId
                    );


                if (existingProduct) {

                    existingProduct.quantity += quantity;

                } else {

                    cart.push({

                        id: productId,

                        mongoId: product._id,

                        name: product.name,

                        price: product.price,

                        oldPrice: product.oldPrice,

                        image: product.image,

                        category: product.category,

                        quantity: quantity

                    });
                }


                /* =========================
                   SAVE CART
                ========================= */

                localStorage.setItem(
                    "cart",
                    JSON.stringify(cart)
                );


                updateCartNumber();


                alert(
                    `${product.name} added to cart!`
                );

            } catch (error) {

                console.error(
                    "Add to Cart Error:",
                    error
                );

                alert(
                    "Unable to add product to cart."
                );
            }
        }


        /* =========================
           BUY NOW
        ========================= */

        async function buyNow(productId) {

            await addProductToCart(productId);

            window.location.href =
                "checkout.html";
        }


        /* =========================
           UPDATE CART NUMBER
        ========================= */

        function updateCartNumber() {

            const cart =
                JSON.parse(
                    localStorage.getItem("cart")
                ) || [];


            const totalItems =
                cart.reduce(
                    (total, item) =>
                        total + Number(item.quantity || 0),
                    0
                );


            const cartCount =
                document.getElementById("cart-count");


            if (cartCount) {
                cartCount.textContent =
                    totalItems;
            }
        }


        /* =========================
           PAGE LOAD
        ========================= */

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                loadProduct();

                updateCartNumber();

            }
        );

    </script>

</body>
</html>
