<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout | SHOPORA</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/checkout.css"
    >

    <style>

        /* ==========================================
           CHECKOUT FORM FIXES
        ========================================== */

        .checkout-form-section {
            position: relative;
            z-index: 5;
        }

        .form-group {
            position: relative;
            z-index: 6;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            position: relative;
            z-index: 7;
            width: 100%;
            box-sizing: border-box;
            pointer-events: auto;
        }

        #paymentMethod {
            display: block;
            cursor: pointer;
            min-height: 48px;
            appearance: auto;
            -webkit-appearance: auto;
        }

        .place-order-btn {
            position: relative;
            z-index: 10;
            cursor: pointer;
            pointer-events: auto;
        }

    </style>

</head>


<body>


    <!-- ==========================================
         HEADER
    =========================================== -->

    <header class="header">

        <div class="logo">

            <a href="index.html">
                SHOPORA
            </a>

        </div>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="cart.html">
                Cart
            </a>

        </nav>

    </header>



    <!-- ==========================================
         CHECKOUT
    =========================================== -->

    <main class="checkout-container">

        <h1>
            Checkout
        </h1>


        <div class="checkout-layout">


            <!-- ======================================
                 SHIPPING INFORMATION
            ======================================= -->

            <section class="checkout-form-section">

                <h2>
                    Shipping Information
                </h2>


                <form
                    id="checkoutForm"
                    novalidate
                >


                    <!-- Full Name -->

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >

                    </div>



                    <!-- Email -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>



                    <!-- Phone -->

                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            autocomplete="tel"
                            required
                        >

                    </div>



                    <!-- Address -->

                    <div class="form-group">

                        <label for="address">
                            Complete Address
                        </label>

                        <textarea
                            id="address"
                            name="address"
                            placeholder="House no, street, area..."
                            autocomplete="street-address"
                            required
                        ></textarea>

                    </div>



                    <!-- City -->

                    <div class="form-group">

                        <label for="city">
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            name="city"
                            placeholder="Enter your city"
                            autocomplete="address-level2"
                            required
                        >

                    </div>



                    <!-- ==================================
                         PAYMENT METHOD
                    =================================== -->

                    <div class="form-group">

                        <label for="paymentMethod">
                            Payment Method
                        </label>


                        <select
                            id="paymentMethod"
                            name="paymentMethod"
                            required
                        >

                            <option
                                value=""
                                selected
                            >
                                Select Payment Method
                            </option>

                            <option value="Cash on Delivery">
                                Cash on Delivery
                            </option>

                            <option value="Bank Transfer">
                                Bank Transfer
                            </option>

                        </select>

                    </div>



                    <!-- ==================================
                         PLACE ORDER
                    =================================== -->

                    <button
                        type="submit"
                        id="placeOrderBtn"
                        class="place-order-btn"
                    >
                        Place Order
                    </button>


                </form>

            </section>



            <!-- ======================================
                 ORDER SUMMARY
            ======================================= -->

            <section class="order-summary-section">

                <h2>
                    Order Summary
                </h2>


                <div id="checkoutItems"></div>


                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <span id="checkoutSubtotal">
                        Rs. 0
                    </span>

                </div>



                <div class="summary-row">

                    <span>
                        Shipping
                    </span>

                    <span id="checkoutShipping">
                        Rs. 200
                    </span>

                </div>



                <div class="summary-total">

                    <span>
                        Total
                    </span>

                    <span id="checkoutTotal">
                        Rs. 0
                    </span>

                </div>


            </section>


        </div>

    </main>



    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="js/storage.js"></script>

    <script src="js/products.js"></script>

    <script src="js/checkout.js"></script>


</body>

</html>
```
